[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainwave-bot-prototype"
version = "0.1.0"
description = "LangChain-orchestrated natural-language business reporting prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlglot>=25,<30",
  "langchain>=1.3,<2",
  "langchain-openai>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
brainwave = "brainwave_bot.cli:main"

[tool.setuptools.packages.find]
include = ["brainwave_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
